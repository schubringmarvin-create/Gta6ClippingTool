<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GTA Clips">
  <title>GTA Clips</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="screen hidden">
    <form id="login-form" class="card login-card">
      <div class="brand">GTA<span>CLIPS</span></div>
      <p class="muted">Dein Clip-Ersteller. Bitte anmelden.</p>
      <input id="login-pw" type="password" placeholder="Passwort" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Anmelden</button>
      <p id="login-err" class="err"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <div class="brand">GTA<span>CLIPS</span></div>
      <button id="refresh" class="icon-btn" aria-label="Aktualisieren">↻</button>
    </header>
    <main id="view"></main>
    <nav class="tabs">
      <button data-tab="live" class="active"><span>●</span>Live</button>
      <button data-tab="clips"><span>▶</span>Clips</button>
      <button data-tab="campaigns"><span>$</span>Kampagnen</button>
      <button data-tab="tracker"><span>↗</span>Tracker</button>
      <button data-tab="streamers"><span>☰</span>Streamer</button>
    </nav>
  </div>

  <div id="sheet" class="sheet hidden"><div class="sheet-body" id="sheet-body"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
